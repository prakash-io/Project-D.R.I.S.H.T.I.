# D.R.I.S.H.T.I. data manifest
#
# The single source of truth for every dataset the platform needs.
# `scripts/check_data.py` reads this file to report what is present or missing,
# so keep `path` accurate — it is the contract, not documentation.
#
# Every `rows`, `columns`, `geometry`, and `crs` below was read off the actual
# file, not copied from the spec. Where the two disagree the file wins, and the
# discrepancy is called out in `spec_says`.
#
# Conventions (project decisions, applied to everything below):
#   - Vector CRS is EPSG:4326 on the wire and in PostGIS.
#     Reproject on ingest, never at query time.
#   - Rasters are already EPSG:4326 here; rasterio still handles the transform.
#   - `raw/` is immutable. Never write to it from a script.
#   - Anything in `processed/` or `artifacts/` must be rebuildable from `raw/`.

version: 2
source: >
  Google Drive folder CLEAN_READY_DATA, downloaded 2026-08-25. Drive split the
  export into six part-folders; they were a partition (0 overlapping paths,
  verified by relpath) and have been merged. Provenance upstream of the Drive
  folder is unrecorded — see the `source:` field on each entry.

datasets:
  # ================================================================ Epic 1 / DB-02
  # GeoPandas -> PostGIS import. Builds the pgRouting topology.
  - id: road_network
    path: data/raw/geo/road_network.parquet
    format: geoparquet
    rows: 238170
    geometry: [MultiLineString, GeometryCollection]
    crs: EPSG:4326
    consumed_by: [DB-02]
    loads_into: road_edges
    required: true
    source: OSM extract (tags preserved), via CLEAN_READY_DATA/02
    columns: [id, name, highway, surface, smoothness, maxspeed, bridge,
              tunnel, ford, cutting, embankment, incline, lanes, geometry]
    spec_says: LineString
    notes: >
      TWO INGEST HAZARDS, both silent if unhandled:

      1. Geometry is MultiLineString with some GeometryCollection. road_edges
         declares LINESTRING, so a raw COPY fails. Ingest must ST_Dump to
         single parts and drop non-linear members of the collections. One
         source row therefore becomes N edges — `id` is NOT unique after
         dumping and cannot be the primary key.

      2. There is no source/target/cost/reverse_cost. Topology does not exist
         yet and must be built with pgr_createTopology after import; cost has
         to be derived (ST_Length(geom::geography), optionally weighted by
         `highway` class and `surface`).

  - id: bridges
    path: data/raw/geo/bridges.parquet
    format: geoparquet
    rows: 12305
    geometry: MultiLineString
    crs: EPSG:4326
    consumed_by: [DB-02]
    required: true
    source: OSM extract (bridge=yes subset of the road network)
    columns: same 13 OSM tag columns as road_network
    spec_says: Point
    notes: >
      These are bridge road *segments*, not point features — same schema as
      road_network, filtered to bridge tags. Treat as a road_edges attribute
      (is_bridge) rather than a separate layer. Flood risk on one blocks the
      edge outright.

  - id: districts
    path: data/raw/geo/districts.parquet
    format: geoparquet
    rows: 88
    geometry: [Polygon, MultiPolygon]
    crs: EPSG:4326
    consumed_by: [DB-02]
    required: true
    source: Census of India district boundaries
    columns: [DISTRICT, ST_NM, ST_CEN_CD, DT_CEN_CD, censuscode,
              geometry, state_name, district_name]
    notes: >
      Admin boundaries for dashboard filtering and alert scoping.
      DISTRICT/ST_NM are the raw census spellings; state_name/district_name
      are the normalised pair — join on the normalised ones.

  - id: hazard_pinch_points
    path: data/raw/geo/hazard_pinch_points.parquet
    format: geoparquet
    rows: 5818
    geometry: MultiLineString
    crs: EPSG:4326
    consumed_by: [DB-02, WEB-04]
    required: false
    source: derived upstream from road_network
    notes: >
      Road segments pre-identified as chokepoints — single points of failure
      where a block has no local detour. Not in the original spec. Useful as a
      static risk prior on road_edges and as a dashboard overlay.

  - id: landslide_events
    path: data/raw/geo/landslide_events.parquet
    format: geoparquet
    rows: 8130
    geometry: Point
    crs: EPSG:4326
    consumed_by: [ML-04]
    required: true
    source: GSI landslide inventory (India)
    notes: >
      The positive-class ground truth behind the risk model — 8130 rows here
      matches LANDSLIDE_RISK=8130 in the training split exactly, so this is
      what X_train was built from. 38 attribute columns (trigger_cause,
      material_type, movement_type, lithology, runout_distance_m, ...) that
      the current 8-feature model does not use.

  # ================================================================ Epic 1 / routing
  - id: road_graph
    path: data/raw/graph/ner_road_graph.gpickle
    format: networkx_pickle
    size_gb: 1.55
    consumed_by: [DB-02, MOB-06]
    required: false
    source: derived upstream from road_network
    notes: >
      Pre-built NetworkX graph of the same 238170 road rows. Redundant with
      PostGIS routing on the server, but it is the natural seed for the
      on-device cached road graph used for dark-zone map-matching (MOB-06).

      Pickle executes arbitrary code on load and is bound to the NetworkX
      version that wrote it — do not load it in the API process. Convert once,
      offline, to a flat format for the mobile bundle.

      A duplicate of this file shipped as ner_road_graph.pkl (byte-identical,
      sha256 cf5089d2...) and was deleted; roads.parquet was likewise
      byte-identical to road_network.parquet (sha256 9408e194...) and deleted.

  # ================================================================ Epic 2 / ML-02
  - id: terrain_rasters
    path: data/raw/terrain/
    format: geotiff
    count: 27
    crs: EPSG:4326
    resolution_m: 30
    dtype: float32
    compression: DEFLATE
    consumed_by: [ML-02, ML-04]
    required: true
    source: SRTM/Copernicus-derived DEM plus computed slope and aspect
    layout: "{region}_{dem|slope|aspect}_epsg4326.tif"
    regions: [arunachal_pradesh, assam, manipur, meghalaya, mizoram,
              nagaland, sikkim, siliguri_corridor, tripura]
    spec_says: a single arunachal_pradesh_30m.tif
    notes: >
      NOT one raster — 9 regions x 3 layers, 7.6 GB total. Assam is the
      largest at 22680x14041 (~1.1 GB per layer).

      Slope and aspect are PROVIDED, not derived at request time. The old
      note in v1 of this manifest claiming they get computed into
      processed/landslide was wrong; nothing needs to compute them.

      ML-02 says "load raster handles into API memory on startup" — with 27
      rasters at 7.6 GB that means rasterio dataset handles only (lazy,
      windowed reads), never full arrays. Open all 27 once, keep them open,
      and dispatch a sample to the right region by bounds.

      These are DEFLATE-compressed and striped rather than tiled, so a
      single-pixel read decompresses a whole strip. If point sampling shows
      up hot, convert to tiled COGs once rather than caching in-process.

  - id: river_waterways
    path: data/raw/hydrology/river_waterways.parquet
    format: geoparquet
    rows: 131612
    geometry: [LineString, MultiLineString]
    crs: EPSG:4326
    consumed_by: [ML-02]
    required: true
    source: HydroRIVERS
    columns: [HYRIV_ID, MAIN_RIV, DIS_AV_CMS, UPLAND_SKM, ORD_STRA, geometry]
    spec_says: rivers_waterways.parquet
    notes: >
      Filename is river_waterways (singular "river"), not rivers_waterways.
      Source geometry for the KDTree index below. ORD_STRA (Strahler order)
      and DIS_AV_CMS (mean discharge) are unused by the current feature set
      but are the obvious way to weight flood risk by river size later.

  # ================================================================ Epic 2 / ML-05
  - id: vision_hazard_yolo
    path: data/raw/vision/incident-yolo
    format: yolo_dataset
    layout: "{train,val,test}/{images,labels}/ + data.yaml + dataset_summary.json"
    images: {train: 965, val: 207, test: 208}
    consumed_by: [ML-05]
    required: true
    source: CLEAN_READY_DATA/05
    image_size: [640, 640]
    classes:
      0: NORMAL_TERRAIN
      1: FLOODED_ROAD_OR_SUBMERGED
      2: ACTIVE_LANDSLIDE_DEBRIS
      3: DAMAGED_BRIDGE_INFRASTRUCTURE
    spec_says: "3 classes: [landslide, flood, obstruction]"
    notes: >
      FOUR classes, not three, and none of the names match the spec. This
      contradicts the incidents.kind CHECK constraint in migration 001, which
      allows only ('landslide','flood','obstruction'). Resolve before ML-06:
      either widen the constraint to cover damaged-bridge and add an explicit
      "no hazard found" rejection path for NORMAL_TERRAIN, or map 3->
      obstruction at the API boundary and document the lossy mapping.

      NORMAL_TERRAIN is a real prediction, not a background class: a driver
      photo scoring class 0 means the report is unverified and must NOT
      block an edge.

      Class order in data.yaml is load-bearing — YOLO emits indices and the
      backend maps index -> incident kind. Reordering silently relabels every
      past incident.

      Class balance is skewed: DAMAGED_BRIDGE_INFRASTRUCTURE has 40 train /
      3 val / 6 test images. Val at n=3 cannot support a per-class metric.

      R7 — IT IS WORSE THAN IMBALANCE. TWO OF THE FOUR CLASSES ARE NOT
      CONTENT LABELS AT ALL. They are assigned by filename index arithmetic,
      verified against all 1380 labels with zero violations:

          landslide pool:  index % 4  == 0  ->  NORMAL_TERRAIN         (800/800)
          flood pool:      index % 12 == 0  ->  DAMAGED_BRIDGE_INFRA.  (580/580)

      There are only two image pools, flood_* and landslide_*, and the two
      minority classes are sprinkled deterministically across them. An image
      labelled NORMAL_TERRAIN is a landslide photograph that landed on an
      index divisible by 4.

      Consequences, measured rather than assumed:

      * Those two classes are unlearnable by construction. 36 of 208 test
        images (17.3%) carry a label uncorrelated with their content, which
        puts a hard 0.827 ceiling on top-1. The trained model hits exactly
        0.8269 and gets 172/172 = 100% of the honestly-labelled images right.
      * The confidence threshold cannot guard it. All 30 NORMAL_TERRAIN test
        images come back ACTIVE_LANDSLIDE_DEBRIS at median confidence 0.794,
        against 0.786 for genuine landslides. At 0.90 the threshold rejects
        0 of 30 mislabelled-normal images and 82 of 86 true landslides.

      The dataset supports a TWO-class flood/landslide verifier and nothing
      more. NORMAL_TERRAIN — the guard that stops a road being blocked on a
      photo of nothing — cannot be trained from this data.

      R8 — AND THE IMAGES ARE THE WRONG KIND. Inspected directly: the
      landslide pool is SATELLITE false-colour tiles of forested hillsides;
      the flood pool is AERIAL press and drone photography (one carries a
      news-agency watermark). Both pools are remote sensing. Neither contains
      what /verify-incident is actually sent — a ground-level photograph taken
      by a driver standing in front of a blocked road. Every real input is out
      of distribution.

      This also explains the perfect scores. The two pools differ by imaging
      MODALITY, not by hazard: a colour histogram alone (48 numbers, all
      shape and texture destroyed) separates them at 86.7%, and the CNN
      reaches val top-1 = 1.000 after ONE epoch. The model is distinguishing
      satellite tiles from aerial photos, which is not the task.

      Fixing this needs new data: a few hundred ground-level NER road photos
      per class, including a genuine "nothing wrong here" class. See
      REVISION.md open questions.

      data.yaml `path:` still points at D:/SIH DATA/... from the machine that
      built it. Rewrite to this directory before training.

  # ================================================================ Epic 4 / MOB-05
  - id: io_vnbd
    path: data/raw/imu/IO-VNBD
    format: csv_timeseries
    sample_rate_hz: 10
    size_gb: 1.7
    csv_files: 564
    consumed_by: [MOB-05]
    required: true
    source: https://github.com/onyekpeu/IO-VNBD (git clone WITH git-lfs)
    spec_says: 100 Hz
    notes: >
      Resolved 2026-08-25. The earlier copy was a GitHub "Download ZIP", which
      does not resolve LFS: all 564 CSVs were 132-byte pointer stubs while the
      tree looked complete. Re-fetched with `git lfs install && git clone`.
      Verify this dataset by file SIZE, never by file count.

      **Sampled at 10 Hz, not the 100 Hz the plan assumes.** Both halves are
      resampled to a 10 Hz grid. The 50-timestep window is therefore 5
      seconds of context, and a phone polling its IMU at 100 Hz must decimate
      to 10 Hz before inference or every window covers 0.5 s of motion and
      the model is being fed a distribution it never saw.

      Structure — only the synchronised half is usable, and it has two traps:

        * "Synchronised V abd S datasets/" holds row-aligned S- (smartphone)
          and V- (vehicle CAN bus) pairs, identical row counts, positional
          join is correct.
        * "Unsynchronised V and S Dataset/" is NOT row-aligned; there is no
          correct way to attach a vehicle velocity to a phone IMU window.

        1. Case is inconsistent across the halves: `S-Vta10.csv` pairs with
           `V-vta10.csv`. Case-sensitive matching silently pairs 32 of 72
           sessions and discards the rest.
        2. Every session appears twice — once under Uncategorised/{S,V}-Dataset
           and again under Categorised/<driver>/<session>/ — at slightly
           different lengths. Loading both puts one drive in two splits and
           leaks the target. scripts/train_idr_speed.py keeps the
           uncategorised (untrimmed) copy.

      Phone columns are ACCELEROMETER X/Y/Z (m/s², gravity NOT removed) and
      GYROSCOPE Yaw/Pitch/Roll (rad/s). The phone's own `GPS SPEED (Kmh)` is
      mislabelled — the values are m/s (median V/S ratio 3.58) and correlate
      only 0.84 with the vehicle. Take the target from the V- file's
      `Velocity (km/hr)` instead.

  # ================================================================= processed
  - id: landslide_features
    path: data/processed/landslide/
    format: parquet
    consumed_by: [ML-04]
    required: true
    source: derived upstream from landslide_events + terrain_rasters + river_waterways
    files:
      X_train.parquet: 15536 rows
      X_val.parquet:    3329 rows
      X_test.parquet:   3330 rows
      y_train.parquet: 15536 rows
      y_val.parquet:    3329 rows
      y_test.parquet:   3330 rows
      features_metadata.json: feature order, scaler params, class distribution
    spec_says: X_train_2.parquet / y_train_2.parquet
    columns_X:
      # 10 columns. The first two are passed through UNSCALED.
      - latitude
      - longitude
      # the 8 scaled features, in this exact order
      - elevation_m
      - slope_deg
      - aspect_deg
      - dist_to_river_m
      - dist_to_road_m
      - rainfall_72h_mm
      - rainfall_24h_mm
      - rainfall_intensity_mmh
    columns_y: [is_hazard, hazard_type, hazard_label]
    class_distribution:
      LANDSLIDE_RISK: 8130
      SAFE_TERRAIN: 8065
      FLOOD_RISK: 6000
    notes: >
      No "_2" suffix, and there is a val split the spec never mentioned —
      use it, do not tune on test.

      X has 10 columns but the scaler takes 8. latitude/longitude are
      deliberately unscaled and must be excluded from the transform; passing
      all 10 to the scaler raises, passing the scaled 8 in the wrong order
      does not. Order is load-bearing in both directions.

      R7 — THE 8 FEATURE COLUMNS IN THESE FILES ARE ALREADY SCALED. They are
      RobustScaler OUTPUT, not raw units: elevation_m has median 0.0 and
      range [-0.61, 6.46]. Only latitude/longitude are raw, which is exactly
      what makes the file look unscaled at a glance. Applying the scaler
      again during training centres already-centred data and produces a model
      that disagrees with the service, which scales raw metres and degrees on
      the way in. train_hazard_xgb.py asserts median 0 / IQR 1 across all
      eight and refuses to run otherwise. Inverse-transforming recovers sane
      units (elevation 0–5867 m, slope 0.1–61.5 deg), which is how it was
      confirmed.

      R8 — HALF THESE FEATURES ARE NOT MEASUREMENTS OF THE GIVEN COORDINATE.
      X carries latitude/longitude, so every feature can be re-derived through
      the serving pipeline and compared. Over 490 training coordinates that
      fall on the terrain sheets:

          elevation_m      corr  0.979   real (median |diff| 0.0 m)
          dist_to_road_m   corr  0.999   real
          dist_to_river_m  corr  0.844   real
          slope_deg        corr  0.309   NOT the terrain slope
          aspect_deg       corr -0.018   uniform noise

      aspect_deg is statistically indistinguishable from Uniform(0,360) across
      all 22195 rows (KS p = 0.33). It is not terrain aspect, and the model
      correctly gives it only 0.36% of gain.

      slope_deg is the serious one. It correlates 0.309 with the rasters, its
      per-class ranges carry hand-round bounds (FLOOD 0.10–4.50, SAFE
      1.00–18.00, LANDSLIDE 15.00–61.82), and it holds ~61% of the model's
      gain. The input the model leans on hardest is one the service cannot
      reproduce: at serving time it is handed a real raster slope, having
      learned on a class-conditioned synthetic one.

      A further 18.3% of training coordinates fall outside every terrain sheet
      and cannot be reproduced at all.

      /predict-hazard therefore returns `unvalidated_features` and
      `trustworthy: false` on every request rather than presenting the score
      as a calibrated probability.

      Feature names differ from the spec's guess: rainfall is 24h/72h plus an
      intensity term (mm/h), NOT rainfall_1h. Open-Meteo queries in ML-03
      must produce exactly these three aggregates.

      The target is 3-class (hazard_type), not binary — the spec's "Landslide
      Risk Probability Score (0-1)" is either P(is_hazard) or
      P(hazard_type == LANDSLIDE_RISK), and flood and landslide risk are
      distinguishable. RESOLVED in R7 by serving both: the model is 3-class
      and /predict-hazard returns per-class probabilities alongside
      hazard_probability = 1 - P(SAFE_TERRAIN), which is what the 0.85
      threshold compares against.

  - id: spatial_indices
    path: data/processed/indices/
    format: pickle_kdtree
    consumed_by: [ML-02]
    required: true
    source: derived upstream
    files:
      river_waterways_spatial_index.pkl:    {points: 450860, mb: 54.6}
      hazard_pinch_points_spatial_index.pkl: {points: 609308, mb: 127.5}
      bridges_spatial_index.pkl:            {points: 28532,  mb: 6.7}
      road_network_spatial_index.pkl:       {points: 6252739, mb: 275.6}
      indices_metadata.json: build provenance and per-layer geometry validation
      road_network_spatial_index.json: provenance for the road index (R7)
    notes: >
      scipy KDTree over densified vertices, loaded into FastAPI memory at
      startup. Three indices, not one — the spec only named the river index.

      RESOLVED (R7) — the indices are NOT in degrees, as R4 suspected they
      might not be. tree.data holds PROJECTED METRES:

          x = lon * 111139 * cos(25.5 deg)     y = lat * 111139

      an equirectangular projection about the NER centre latitude, with each
      index carrying its own center_lat: 25.5. Recovered by least-squares
      against each index's own feature_records lat/lon and exact to ~1e-9 m
      on all three. Note 111139, not the WGS84 111319.49 nor R*pi/180.

      Querying one with a raw (lon, lat) pair does not raise — it lands the
      query ~10^7 m outside the data cloud and returns an arbitrary confident
      neighbour. Measured: a (27.5, 92.0) query returns a road vertex 399.7 km
      away instead of the true 709 m.

      The projection is exact only at 25.5 deg, so it is used to FIND
      candidates and never to MEASURE them: drishti_ai.geo pulls k=8 and
      re-ranks by haversine against the neighbour's true lat/lon.
      verify_projection() re-checks the constants at every startup, so a
      rebuilt index with a different constant fails loudly instead of
      serving quietly wrong distances.

      Pickle is Python- and SciPy-version-sensitive; rebuild rather than move
      between interpreter versions.

  - id: landslide_features_rebuilt
    path: data/processed/landslide_rebuilt/
    format: parquet_splits
    consumed_by: [ML-04]
    required: true
    rows: 17783
    source: scripts/rebuild_hazard_features.py, from landslide_features (R9)
    rebuilt_columns: [slope_deg, aspect_deg]
    relabelled: true
    files:
      X_train.parquet: 8 scaled features + raw latitude/longitude
      X_val.parquet: same schema
      X_test.parquet: same schema
      y_train.parquet: is_hazard, hazard_type, hazard_label
      y_val.parquet: same schema
      y_test.parquet: same schema
      rebuild_meta.json: row counts, correlations, and the recovered rule
    notes: >
      THIS is what ML-04 trains on. The shipped landslide_features table is
      kept untouched as the historical record; it must not be trained from.

      slope_deg and aspect_deg are re-sampled from the terrain GeoTIFFs at
      each row's own lat/lon, so they now correlate 1.000 with what the
      service computes (0.309 and -0.018 before). The scaler is NOT refitted —
      the service loads that exact artefact, and refitting would put training
      and serving back out of agreement. Those two columns therefore no longer
      have median 0 / IQR 1, which is expected.

      4,247 rows (19.1%) were dropped because they fall outside every terrain
      sheet, so no real slope exists for them. A further 165 were dropped
      because the rebuild CREATED leakage: replacing slope/aspect collapses
      coordinates differing only in those columns into identical feature
      vectors, and 88 test + 77 val rows then matched a train row. The
      originals had none of this.

      RELABELLED, and this is the part that matters. The labels were generated
      from the OLD slope, so carrying them onto real terrain unchanged inverts
      the model: mean slope per class went FLOOD 1.4->16.5, SAFE 8.1->17.0,
      LANDSLIDE 32.0->27.6, real slope predicted the label at 0.545 (from
      0.934), and the model called a 1.8 deg valley floor LANDSLIDE_RISK while
      still scoring 0.907 against those broken labels. The dataset's own rule
      was recovered by fitting a depth-6 tree on the ORIGINAL raw features
      against the ORIGINAL labels (held-out fidelity 0.9845) and re-applied to
      the rebuilt features. No threshold is hand-chosen.

  # ================================================================= artifacts
  - id: feature_scaler
    path: data/artifacts/risk/feature_scaler.joblib
    format: joblib_sklearn
    consumed_by: [ML-02, ML-04]
    required: true
    source: fitted upstream on X_train
    scaler_class: RobustScaler
    n_features_in: 8
    fitted_with: scikit-learn 1.9.0
    spec_says: StandardScaler, feature_scaler_2.joblib
    notes: >
      RobustScaler (median / IQR), NOT StandardScaler — centre and scale are
      quantile statistics, so anything reimplementing it as (x - mean) / std
      is wrong. features_metadata.json carries scaler_center and scaler_scale
      if the pickle ever needs reconstructing without sklearn.

      Pinned to scikit-learn >= 1.9.0. Loading it under 1.7.2 (the current
      local env) raises InconsistentVersionWarning and is explicitly not
      guaranteed to score correctly.

      carries feature_names_in_, so pass a DataFrame with the 8 named columns
      and let sklearn check the order rather than relying on positional order.

  - id: risk_model
    path: data/artifacts/risk/hazard_model.json
    format: xgboost_json
    consumed_by: [ML-04, ML-06]
    required: true
    # No `status:` -- that field means "on disk but not the thing it claims"
    # and check_data.py treats any value as a blocker. Training dates belong
    # in trained_on.
    trained_on: 2026-08-25
    source: scripts/train_hazard_xgb.py, trained on landslide_features_rebuilt
    trained_by: scripts/train_hazard_xgb.py
    spec_says: risk-xgb.ubj
    files:
      hazard_model.json: multi:softprob booster, 891 KB
      hazard_model_meta.json: feature order, class order, held-out metrics
    architecture: 3-class multi:softprob, depth 6, 86 trees (early-stopped)
    feature_source: rebuilt_from_rasters
    accuracy:
      test_accuracy: 0.9942
      roc_auc_hazard: 0.9996
      roc_auc_landslide: 1.0000
      depth_2_tree_baseline: 0.9290
    notes: >
      THE 0.85 QUESTION IS RESOLVED by making it moot: the model is 3-class,
      so the response carries per-class probabilities AND
      hazard_probability = 1 - P(SAFE_TERRAIN). RISK_FLAG_THRESHOLD compares
      against hazard_probability. WEB-04 and ML-06 now share one definition.

      READ THE ACCURACY WITH CARE. 99.1% is not landslide-prediction skill.
      The labels are rule-generated from the features themselves: a DEPTH-2
      DECISION TREE — two thresholds on two features — reaches 0.9607 on the
      same held-out rows against xgboost's 0.9913. train_hazard_xgb.py prints
      that baseline on every run so the headline can never be read alone. The
      rule is slope_deg > ~15 deg -> LANDSLIDE_RISK, dist_to_river_m < ~800 m
      -> FLOOD_RISK, else SAFE_TERRAIN.

      R9 — RETRAINED ON landslide_features_rebuilt. The fabricated slope and
      aspect are gone: both now correlate 1.000 with what the service computes,
      the labels were re-derived with the dataset's own recovered rule, and
      /predict-hazard reports `trustworthy: true` again.

      Physical sanity, which accuracy alone did not catch: 44.6 deg at 4061 m
      -> LANDSLIDE_RISK 0.957; 4.8 deg on the Brahmaputra floodplain ->
      FLOOD_RISK 0.968; 1.8 deg valley floor -> SAFE_TERRAIN 0.126.

      Still a demonstrator: the model recovers a threshold rule, it does not
      forecast landslides. Validating against real landslide outcomes is a
      separate, unstarted job.

      The pipeline itself is sound: no row overlap between splits (checked),
      early stopping on val, test never used for selection.

  - id: incident_model
    path: data/artifacts/vision/incident-yolov8n.pt
    format: pytorch_ultralytics
    consumed_by: [ML-05, ML-06]
    required: true
    trained_on: 2026-08-25
    source: scripts/train_incident_yolo.py, trained on vision_hazard_yolo
    trained_by: scripts/train_incident_yolo.py
    architecture: yolov8n-cls, 1.44M params, imgsz 224, 40 epochs, 3.0 MB
    classes: [FLOODED_ROAD_OR_SUBMERGED, ACTIVE_LANDSLIDE_DEBRIS]
    label_source: pool
    accuracy:
      test_top1: 1.000
      recall_FLOODED_ROAD_OR_SUBMERGED: 1.000
      recall_ACTIVE_LANDSLIDE_DEBRIS: 1.000
    notes: >
      CLASSIFICATION, not detection, though the source ships in detection
      format. Every one of the 1380 images carries exactly one box, so the
      task is one-label-per-image; the endpoint needs a class and a
      confidence, not a box; and a detector that finds nothing returns
      silence, which is dangerously easy to confuse with NORMAL_TERRAIN.

      THE INDEX ORDER IS NOT data.yaml's. ImageFolder assigns class indices
      alphabetically, so the trained model is
      [ACTIVE_LANDSLIDE_DEBRIS, DAMAGED_BRIDGE_INFRASTRUCTURE,
      FLOODED_ROAD_OR_SUBMERGED, NORMAL_TERRAIN] while data.yaml is
      [NORMAL_TERRAIN, FLOODED_ROAD_OR_SUBMERGED, ACTIVE_LANDSLIDE_DEBRIS,
      DAMAGED_BRIDGE_INFRASTRUCTURE]. Nothing may map a raw index through
      data.yaml. IncidentVerifier maps by NAME via result.names.

      R8 — RETRAINED AS TWO CLASSES (`--label-source pool`). The 4-class run
      scored 0.827 with two classes at 0.000 recall, because those two labels
      are filename arithmetic. Training on the pool label instead keeps all
      1380 images, drops the noise, and every output now means something.

      DO NOT READ test_top1 = 1.000 AS SKILL. The two pools are different
      imaging modalities, val accuracy is 1.000 after one epoch, and a colour
      histogram alone gets 86.7%. It is separating satellite tiles from aerial
      photos.

      Because the model has no "no incident" class AND is out of distribution
      on ground-level photographs, /verify-incident returns
      `requires_human_review: true` on every verified incident and API-03 must
      not block an edge without dispatcher confirmation (WEB-05).

      YOLO_CONF_THRESHOLD must exceed 1/n_classes or it can never reject:
      top-1 softmax over 2 classes is always >= 0.5, which made the inherited
      0.45 dead code. Raised to 0.75 and checked at startup.

      Kept nano deliberately: verification runs synchronously in the incident
      POST path, and it measures 0.4 ms/image on M2 MPS.

  - id: velocity_cnn
    path: data/artifacts/edge/speed_model.tflite
    format: tflite
    consumed_by: [MOB-05, MOB-06]
    required: true
    source: scripts/train_idr_speed.py, trained on io_vnbd 2026-08-25
    trained_by: scripts/train_idr_speed.py
    files:
      speed_model.tflite: full-int8, 34.9 KB — bundled into the app
      speed_model_float.tflite: dynamic-range, 33.6 KB
      speed_model.keras: unquantised, 300 KB
      speed_model_meta.json: normalisation + quantisation params for C++
    architecture: 1D-CNN, 21665 params, input [1, 50, 6] int8
    accuracy:
      test_mae_ms: 4.024
      test_rmse_ms: 5.259
      test_r2: 0.424
      int8_mae_ms: 5.270
      baseline_mae_ms: 6.093
    notes: >
      The only artifact that leaves the cloud — bundled into the React Native
      app binary, so size and quantisation are shipping constraints, not
      tuning knobs.

      ACCURACY IS NOT YET FIT FOR PURPOSE. Held-out MAE is 4.0 m/s (14.5 km/h)
      against a predict-the-mean baseline of 6.1 — the model learns something
      real, but at 4 m/s of speed error the EKF accumulates roughly 240 m of
      along-track position error per minute of blackout. See the open question
      in REVISION.md before building on this.

      The cause is structural, not a tuning problem: an accelerometer measures
      acceleration, which integrates to a velocity *change*, not an absolute
      velocity. The only absolute-speed signal in a bare IMU window is the
      vibration spectrum, which varies with road surface, load and how the
      phone is mounted. The fix is to change what the model predicts (a
      per-window delta the EKF integrates, or feeding the previous EKF speed
      back in as a 7th channel) rather than to grow the network.

      Full int8 quantisation is currently a bad trade here: it costs 1.25 m/s
      (+31%) and SAVES NOTHING — 34.9 KB int8 vs 33.6 KB dynamic-range,
      because at 21665 params both already carry int8 weights and the integer
      graph adds quantise/dequantise ops. Ship the float model unless the
      target device has an integer-only NPU.

      Normalisation constants are compiled into the app via
      mobile-app/native/SpeedModelParams.h — regenerate it with
      scripts/gen_model_header.py after EVERY retrain, or every prediction
      carries a constant bias nothing in the build will catch.
